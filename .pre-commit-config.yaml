repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      ## This is telling it what to do, like each different built in functiuon that comes with ruff
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.0.dev2
    hooks:
      - id: pyrefly-check
      ##eventually add args but not yet
  - repo: https://github.com/gitleaks/gitleaks.git
    rev: v8.30.0
    hooks:
    ## No specific arguments or hooks to pull from beacause there aren't individual tools
      - id: gitleaks